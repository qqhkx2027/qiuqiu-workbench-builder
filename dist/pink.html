<!DOCTYPE html>
<html lang="zh-CN" data-theme="pink">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>秋秋工作台</title>
<style>
:root{
  --bg:#f7f7f8;--card:#ffffff;--elev:#fafafa;--ink:#111827;--soft:#6b7280;--muted:#9ca3af;
  --line:#e5e7eb;--accent:#3b82f6;--accent-2:#8b5cf6;--accent-3:#10b981;--accent-4:#f59e0b;
  --good:#10b981;--bad:#ef4444;--warn:#f59e0b;--shadow:0 2px 10px rgba(0,0,0,.05);
  --radius:18px;--radius-sm:10px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  --sidebar-w:210px;--maxw:1200px;
}
[data-theme="pink"]{
  --bg:#fff0f5;--card:#fff5f7;--elev:#fff0f4;--ink:#4a2c33;--soft:#9b7a82;--muted:#c4a5ad;
  --line:#f8d7e0;--accent:#ff85a2;--accent-2:#c084fc;--accent-3:#7dd3fc;--accent-4:#fbbf24;
  --good:#34d399;--bad:#fb7185;--warn:#fbbf24;--shadow:0 6px 22px rgba(255,133,162,.16);
  --radius:26px;--radius-sm:16px;
}
[data-theme="dark"]{
  --bg:#0f1115;--card:#181b21;--elev:#20242c;--ink:#f3f4f6;--soft:#9ca3af;--muted:#6b7280;
  --line:#2a2f38;--accent:#22d3ee;--accent-2:#a78bfa;--accent-3:#34d399;--accent-4:#f472b6;
  --good:#34d399;--bad:#f87171;--warn:#fbbf24;--shadow:0 4px 24px rgba(0,0,0,.45);
  --radius:10px;--radius-sm:6px;
}
[data-theme="cinnamoroll"]{
  --bg:#e8f4ff;--card:#f5fbff;--elev:#eef8ff;--ink:#1e3a5f;--soft:#5a7a9c;--muted:#8aa4c0;
  --line:#cbe4f8;--accent:#4facfe;--accent-2:#00f2fe;--accent-3:#7dd3fc;--accent-4:#fde68a;
  --good:#34d399;--bad:#fb7185;--warn:#fbbf24;--shadow:0 6px 22px rgba(79,172,254,.18);
  --radius:26px;--radius-sm:16px;
}
[data-theme="popmart"]{
  --bg:#fff4f7;--card:#fffafd;--elev:#fff0f5;--ink:#563d53;--soft:#986b8e;--muted:#caa8be;
  --line:#f2d6e5;--accent:#ef7899;--accent-2:#8fcde8;--accent-3:#6fd4b7;--accent-4:#f5c968;
  --good:#55c69a;--bad:#eb718c;--warn:#efb84e;--shadow:0 6px 22px rgba(218,119,157,.16);
  --radius:24px;--radius-sm:14px;
}
[data-theme="kuromi"]{
  --bg:#211c2b;--card:#2c2538;--elev:#382d49;--ink:#f8efff;--soft:#c8b4d9;--muted:#927ba8;
  --line:#4a3a5e;--accent:#df6fa3;--accent-2:#9b7cdb;--accent-3:#6fc8c3;--accent-4:#f3bf68;
  --good:#6fd2a5;--bad:#f17b91;--warn:#f3bf68;--shadow:0 6px 24px rgba(0,0,0,.28);
  --radius:20px;--radius-sm:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;overflow:hidden}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none}
button{cursor:pointer;border:none;background:none}
input,textarea,select{border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:10px 12px;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical}

.layout{display:flex;height:100vh;max-width:var(--maxw);margin:0 auto}
.sidebar{width:var(--sidebar-w);height:100%;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.brand{padding:18px 14px 10px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;font-size:18px;flex-shrink:0;overflow:hidden}
.avatar-img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.brand-txt{line-height:1.2}
.brand-txt small{display:block;font-weight:400;font-size:11px;color:var(--soft)}
.nav{flex:1;overflow-y:auto;padding:8px 10px}
.navitem{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:var(--radius-sm);margin-bottom:4px;color:var(--soft);cursor:pointer;transition:.15s;position:relative}
.navitem:hover{background:var(--elev)}
.navitem.active{background:var(--elev);color:var(--ink);font-weight:600}
.navitem.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent);border-radius:2px}
.navitem svg{width:20px;height:20px;flex-shrink:0}
.navfoot{padding:10px;border-top:1px solid var(--line)}
.navfoot .btn{width:100%;margin-bottom:6px;justify-content:center}

.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.topbar{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--card)}
.topbar h1{font-size:18px;margin:0;font-weight:600;display:flex;align-items:center;gap:8px}
.page-icon{width:26px;height:26px;object-fit:contain;border-radius:6px;flex-shrink:0}
.topbar .actions{display:flex;gap:8px}
.content{flex:1;overflow-y:auto;padding:18px 20px 40px}

.mob-header{display:none;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.mob-header .hamburger{width:36px;height:36px;display:grid;place-items:center}
.drawer{position:fixed;inset:0;z-index:100;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.25)}
.drawer .drawer-panel{position:absolute;left:0;top:0;bottom:0;width:260px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.section-title{font-size:14px;font-weight:700;color:var(--soft);margin:18px 0 10px;text-transform:uppercase;letter-spacing:.5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-weight:500;transition:.15s}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn.ghost{background:var(--elev);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}

.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:var(--elev);color:var(--soft);font-size:12px;font-weight:500;border:1px solid var(--line)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.home-time{text-align:center;margin:6px 0 20px}
.home-time .clock{font-size:58px;font-weight:300;letter-spacing:-1px;line-height:1.1}
.home-time .date{font-size:16px;color:var(--soft);margin-top:4px}

.quote-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;border:1px solid var(--line);position:relative;overflow:hidden}
.quote-label{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.quote-en{font-size:20px;font-weight:600;line-height:1.45;margin-bottom:8px}
.quote-cn{color:var(--soft);font-size:15px}
.quote-card::after{content:"\"";position:absolute;right:14px;top:8px;font-size:48px;color:var(--line);font-family:serif;line-height:1}

.todo-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.todo-item:last-child{border-bottom:none}
.todo-check{width:22px;height:22px;border:2px solid var(--line);border-radius:50%;flex-shrink:0;display:grid;place-items:center;cursor:pointer;transition:.15s}
.todo-check.done{background:var(--accent);border-color:var(--accent)}
.todo-check.done::after{content:"✓";color:#fff;font-size:12px;font-weight:700}
.todo-text{flex:1;font-size:15px}
.todo-text.done{text-decoration:line-through;color:var(--muted)}

.rings-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.ring-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 8px;text-align:center;border:1px solid var(--line);cursor:pointer;transition:.15s}
.ring-card:hover{transform:translateY(-2px)}
.ring-wrap{position:relative;width:64px;height:64px;margin:0 auto 6px}
.ring-svg{width:64px;height:64px;display:block}
.ring-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;line-height:1}
.ring-icon img{width:36px;height:36px;object-fit:contain;border-radius:8px;display:block}
.ring-label{font-size:13px;font-weight:600;margin-bottom:2px}
.ring-sub{font-size:11px;color:var(--soft)}
.ring-pct{font-size:15px;font-weight:700;margin-top:3px}

.hbar{margin-bottom:10px}
.hbar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.hbar-track{height:8px;background:var(--elev);border-radius:999px;overflow:hidden}
.hbar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}

.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:7px 14px;border-radius:999px;background:var(--elev);color:var(--soft);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--line)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.list-icon{width:42px;height:42px;border-radius:var(--radius-sm);background:var(--elev);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.list-body{flex:1;min-width:0}
.list-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-meta{font-size:12px;color:var(--soft);margin-top:2px}
.list-action{flex-shrink:0}

.ledger-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.ledger-card{background:var(--elev);border-radius:var(--radius);padding:14px;text-align:center;border:1px solid var(--line)}
.ledger-card .num{font-size:22px;font-weight:700;margin:4px 0}
.ledger-card .label{font-size:12px;color:var(--soft)}

.media-card{display:flex;gap:12px;padding:14px;background:var(--elev);border-radius:var(--radius);margin-bottom:10px;border:1px solid var(--line)}
.media-cover{width:60px;height:80px;border-radius:var(--radius-sm);background:var(--line);flex-shrink:0;display:grid;place-items:center;color:var(--muted);font-size:24px;overflow:hidden}
.media-info{flex:1}
.media-title{font-weight:700;margin-bottom:4px}
.media-meta{font-size:12px;color:var(--soft);margin-bottom:6px}

.diary-moods{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.mood-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--elev);font-size:22px;display:grid;place-items:center;cursor:pointer;transition:.15s}
.mood-btn:hover,.mood-btn.active{border-color:var(--accent);background:var(--card)}

.health-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.health-card{background:var(--elev);border-radius:var(--radius);padding:14px;border:1px solid var(--line)}

.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.35)}
.modal.open{display:flex}
.modal-panel{background:var(--card);border-radius:var(--radius);width:100%;max-width:420px;max-height:90vh;overflow-y:auto;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal-title{font-size:17px;font-weight:700;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--soft);margin-bottom:5px}
.field.row{display:flex;gap:10px;align-items:center}
.field.row label{margin-bottom:0;white-space:nowrap}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}

.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:300;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.float-add{position:fixed;right:20px;bottom:24px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;font-size:28px;display:grid;place-items:center;box-shadow:var(--shadow);z-index:50}

@media(max-width:768px){
  body{overflow:auto}
  .layout{flex-direction:column;height:auto}
  .sidebar{display:none}
  .mob-header{display:flex;position:sticky;top:0;z-index:90}
  .main{height:auto}
  .content{padding:14px}
  .home-time .clock{font-size:46px}
  .rings-row{grid-template-columns:repeat(2,1fr)}
  .ledger-summary{grid-template-columns:1fr}
  .navitem{padding:12px 12px}
}

[data-theme="pink"] .home-time .clock{font-weight:500}
[data-theme="pink"] .quote-card::after{color:#fce7f3}
[data-theme="pink"] .ring-svg circle:first-child{stroke:#fce7f3}
[data-theme="dark"] .home-time .clock{font-weight:400}
[data-theme="dark"] .quote-card::after{color:#2a2f38}
[data-theme="dark"] .card,[data-theme="dark"] .quote-card,[data-theme="dark"] .ring-card{background:#181b21}
[data-theme="dark"] input,[data-theme="dark"] textarea,[data-theme="dark"] select{background:#20242c}
[data-theme="minimal"] .quote-card::after{color:#e5e7eb}
.nav-icon-img{width:22px;height:22px;object-fit:contain;margin-right:10px;vertical-align:middle;flex-shrink:0;border-radius:4px;}
.nav-icon-img{width:22px;height:22px;object-fit:contain;margin-right:10px;vertical-align:middle;flex-shrink:0;border-radius:4px;}





/* cinnamoroll 主题蓝白渐变面板 */
body[data-theme="cinnamoroll"] .nav-icon-img{width:28px;height:28px;margin-right:10px;}
body[data-theme="cinnamoroll"] .ring-icon img{width:40px;height:40px;}
body[data-theme="cinnamoroll"] .page-icon{width:30px;height:30px;}
body[data-theme="cinnamoroll"] .sidebar{background:linear-gradient(180deg,#e8f4ff 0%,#f0f9ff 100%);}
body[data-theme="cinnamoroll"] .topbar{background:linear-gradient(90deg,#f5fbff 0%,#e8f4ff 100%);}
body[data-theme="cinnamoroll"] .card{background:linear-gradient(180deg,#ffffff 0%,#f5fbff 100%);}
body[data-theme="cinnamoroll"] .quote-card{background:linear-gradient(180deg,#ffffff 0%,#f5fbff 100%);}
body[data-theme="cinnamoroll"] .navitem.active{background:rgba(79,172,254,0.12);}
/* POP MART 主题：糖果粉蓝黄的柔和玩具感 */
body[data-theme="popmart"] .sidebar{background:linear-gradient(180deg,#fff7fa 0%,#f5f3ff 55%,#eefaff 100%);}
body[data-theme="popmart"] .topbar{background:linear-gradient(90deg,#fff9fb 0%,#f7f1ff 52%,#f0fbff 100%);}
body[data-theme="popmart"] .card{background:linear-gradient(145deg,#fffafd 0%,#fff1f7 100%);}
body[data-theme="popmart"] .quote-card{background:linear-gradient(145deg,#fffafd 0%,#f0f9ff 100%);}
body[data-theme="popmart"] .navitem.active{background:rgba(239,120,153,.14);}
body[data-theme="popmart"] .avatar{background:linear-gradient(135deg,#ef7899,#8fcde8);padding:2px;}
body[data-theme="popmart"] .nav-icon-img{width:26px;height:26px;margin-right:8px;}
body[data-theme="popmart"] .ring-icon img{width:40px;height:40px;}
body[data-theme="popmart"] .page-icon{width:30px;height:30px;}



/* Kuromi 主题：深紫底色与粉色高光 */
body[data-theme="kuromi"] .sidebar{background:linear-gradient(180deg,#2a2138 0%,#211c2b 100%);}
body[data-theme="kuromi"] .topbar{background:linear-gradient(90deg,#32263f 0%,#29223a 100%);}
body[data-theme="kuromi"] .card{background:linear-gradient(145deg,#30263d 0%,#282137 100%);}
body[data-theme="kuromi"] .quote-card{background:linear-gradient(145deg,#30263d 0%,#252b42 100%);}
body[data-theme="kuromi"] .navitem.active{background:rgba(223,111,163,.2);}
body[data-theme="kuromi"] .avatar{background:linear-gradient(135deg,#df6fa3,#9b7cdb);padding:2px;}
body[data-theme="kuromi"] .nav-icon-img{width:26px;height:26px;margin-right:8px;}
body[data-theme="kuromi"] .ring-icon img{width:40px;height:40px;}
body[data-theme="kuromi"] .page-icon{width:30px;height:30px;}

/* 图标统一圆形 */
.nav-icon-img,.ring-icon img,.page-icon{border-radius:50% !important;}
/* dark 主题图标更大 */
body[data-theme="dark"] .nav-icon-img{width:32px;height:32px;margin-right:10px;}
body[data-theme="dark"] .ring-icon img{width:44px;height:44px;}
body[data-theme="dark"] .page-icon{width:34px;height:34px;}
/* pink 主题粉紫渐变面板 */
body[data-theme="pink"] .sidebar{background:linear-gradient(180deg,#fff0f5 0%,#f5e6ff 100%);}
body[data-theme="pink"] .topbar{background:linear-gradient(90deg,#fff5f7 0%,#f8eeff 100%);}
body[data-theme="pink"] .card{background:linear-gradient(180deg,#fff5f7 0%,#fff0fb 100%);}
body[data-theme="pink"] .quote-card{background:linear-gradient(180deg,#fff5f7 0%,#fff0fb 100%);}
body[data-theme="pink"] .navitem.active{background:rgba(255,133,162,0.12);}

</style>
</head>
<body>
<div class="mob-header">
  <div style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px"><div class="avatar"><img id="mobBrandIcon" class="avatar-img" src="" alt=""></div><span>秋秋工作台</span></div>
  <button class="hamburger" onclick="toggleDrawer()">☰</button>
</div>
<div class="drawer" id="drawer" onclick="toggleDrawer()">
  <div class="scrim"></div>
  <div class="drawer-panel" onclick="event.stopPropagation()">
    <div class="brand"><div class="avatar"><img id="drawerBrandIcon" class="avatar-img" src="" alt=""></div><div class="brand-txt">秋秋工作台<small>我的生活工作台</small></div></div>
    <div class="nav" id="drawerNav"></div>
    <div class="navfoot"><button class="btn ghost small" onclick="exportData()">导出备份</button><button class="btn ghost small" onclick="importData()">导入恢复</button><button class="btn ghost small" onclick="clearSamples()">清示例</button></div>
  </div>
</div>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><div class="avatar"><img id="brandIcon" class="avatar-img" src="" alt=""></div><div class="brand-txt">秋秋工作台<small>我的生活工作台</small></div></div>
    <div class="nav" id="nav"></div>
    <div class="navfoot"><button class="btn ghost small" onclick="exportData()">导出备份</button><button class="btn ghost small" onclick="importData()">导入恢复</button><button class="btn ghost small" onclick="clearSamples()">清示例</button></div>
  </aside>
  <main class="main">
    <header class="topbar"><h1 id="pageTitle">秋秋工作台</h1><div class="actions"><span class="chip" id="connChip">本地</span></div></header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="modal" id="modal" onclick="closeModal(event)"><div class="modal-panel" id="modalPanel" onclick="event.stopPropagation()"></div></div>
<div class="toast" id="toast"></div>
<script>

function dayGanzhi(y,mo,d){const base=Date.UTC(1900,0,1);const cur=Date.UTC(y,mo-1,d);const n=Math.floor((cur-base)/86400000)+10;return {g:((n%10)+10)%10,z:((n%12)+12)%12};}

function computeFortune(b){
  if(!b||!b.date)return null;
  const p=String(b.date).split('-');const y=+p[0],m=+p[1],d=+p[2];const hourIdx=b.hour||0;
  const yStem=((y-4)%10+10)%10,yBranch=((y-4)%12+12)%12;
  const dg=dayGanzhi(y,m,d);
  const hStem=((dg.g*2+hourIdx)%10+10)%10;
  const yearGZ=GAN[yStem]+ZHI[yBranch];
  const dayGZ=GAN[dg.g]+ZHI[dg.z];
  const timeGZ=GAN[hStem]+ZHI[hourIdx];
  const zo=zodiacOf(m,d);const sx=ZHI_ANIMAL[yBranch];const bg=BAGUA[yBranch];
  return {
    bagua:`【生辰八字 · 参考】${yearGZ}年 ${dayGZ}日 ${timeGZ}时。八卦属「${bg}」，主${BAGUA_TEXT[bg]}。`,

function compressOne(file){return new Promise(res=>{const r=new FileReader();r.onload=e=>{const img=new Image();img.onload=()=>{const s=Math.min(1,800/img.width);const w=Math.round(img.width*s),h=Math.round(img.height*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.82));};img.src=e.target.result;};r.readAsDataURL(file);});}
function compressImages(files,cb){Promise.all(Array.from(files).slice(0,9).map(compressOne)).then(cb);}

function renderNav(){
  const html=MODULES.map(m=>{
    const icon=m.icon && m.icon.startsWith('data:') ? `<img class="nav-icon-img" src="${m.icon}" alt="">` : (m.icon?`<span>${m.icon}</span>`:'');
    return `<div class="navitem ${state.view===m.key?'active':''}" data-key="${m.key}" onclick="switchView('${m.key}')">${icon}<span>${m.name}</span></div>`;
  }).join('');
  $('nav').innerHTML=html;
  $('drawerNav').innerHTML=html;
}
function switchView(key){
  state.view=key;
  renderNav();
  $('drawer').classList.remove('open');
  const mod=MODULES.find(m=>m.key===key);
  $('pageTitle').innerHTML=modIcon(mod.key,'page-icon')+`<span>${esc(mod.name)}</span>`;
  const renderers={home:renderHome,todo:renderTodo,create:renderCreate,ai:renderAI,finance:renderFinance,ledger:renderLedger,media:renderMedia,diary:renderDiary,health:renderHealth};
  renderers[key]();
  window.scrollTo(0,0);
}
function toggleDrawer(){$('drawer').classList.toggle('open')}
function updateClock(){const els=$$('.live-clock');els.forEach(el=>{el.textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})})}

function openModal(title,body,onOk){
  $('modalPanel').innerHTML=`<div class="modal-title">${esc(title)}</div>${body}<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" id="modalOk">确定</button></div>`;
  $('modal').classList.add('open');
  if(onOk)$('modalOk').onclick=()=>{onOk();closeModal();};
}
function closeModal(){$('modal').classList.remove('open')}

      ${todos.length>5?`<div style="text-align:center;margin-top:10px"><button class="btn ghost small" onclick="switchView('todo')">查看全部</button></div>`:''}
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">✨ 今日概览</div><span class="chip">点击圆圈进入详情</span></div>

        ${ringCard('健康生活','health',homeHealthPct(),homeHealthDetail(),iconVal('health'))}

        ${ringCard('日记反思','diary',homeDiaryPct(),homeDiaryDetail(),iconVal('diary'))}

function todoRow(t){return `<div class="todo-item"><div class="todo-check ${t.done?'done':''}" onclick="toggleTodo('${t.id}')"></div><div class="todo-text ${t.done?'done':''}">${esc(t.title)} ${t.tags?`<span class="chip">${esc(t.tags[0]||'')}</span>`:''}</div></div>`;}
function toggleTodo(id){const a=DB.get('todos')||[];const t=a.find(x=>x.id===id);if(t){t.done=!t.done;DB.set('todos',a);switchView('home');toast(t.done?'已完成':'已恢复')}}
function addTodo(){
  const body=`<div class="field"><label>任务内容</label><input id="f_title" placeholder="今天要做什么…"></div><div class="field"><label>标签</label><input id="f_tag" placeholder="工作 / 生活 / 习惯"></div>`;
  openModal('添加任务',body,()=>{const t=$('f_title').value.trim();const tag=$('f_tag').value.trim();if(!t)return;DB.push('todos',{id:uid(),title:t,done:false,tags:tag?[tag]:[]});switchView('home');toast('已添加');});
}
function iconVal(key){return (ICON_IMGS[THEME]||ICON_IMGS['minimal'])[key]||'';}
function modIcon(key,cls){const v=iconVal(key);return v&&v.startsWith('data:')?`<img class="${cls||'mod-icon'}" src="${v}" alt="">`:`<span class="${cls||''}">${v||''}</span>`;}
function ringCard(label,linkKey,pct,detail,icon){return `<div class="ring-card" onclick="switchView('${linkKey}')">
  <div class="ring-wrap"><svg class="ring-svg" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--line)" stroke-width="3.5"></circle><circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--accent${['health','media','diary','create'].indexOf(linkKey)+1})" stroke-width="3.5" stroke-dasharray="${pct} ${100-pct}" stroke-linecap="round" transform="rotate(-90 18 18)"></circle></svg><div class="ring-icon">${icon&&icon.startsWith('data:')?`<img src="${icon}" alt="">`:icon}</div></div>
  <div class="ring-label">${label}</div><div class="ring-pct">${pct}%</div><div class="ring-sub">${detail}</div>
</div>`;}
function homeHealthPct(){const h=DB.get('health')||{};const e=(h.exercise||[]).find(x=>x.date===today());const s=(h.sleep||[]).find(x=>x.date===today());const ep=e?Math.min(100,Math.round(e.duration/30*100)):0;const sp=s?Math.min(100,Math.round(s.hours/8*100)):0;return Math.round((ep+sp)/2*100)/100;}
function homeHealthDetail(){const h=DB.get('health')||{};const e=(h.exercise||[]).find(x=>x.date===today());const s=(h.sleep||[]).find(x=>x.date===today());const p=[];if(e)p.push('运动'+e.duration+'m');if(s)p.push('睡'+s.hours+'h');return p.length?p.join('·'):'未记录';}
function homeMediaPct(){const m=DB.get('media')||[];return m.length?Math.round(m.reduce((a,b)=>a+(b.progress||0),0)/m.length):0;}
function homeMediaDetail(){const m=(DB.get('media')||[]).filter(x=>x.status==='在读');return m.length?('在读'+m.length+'本'):'暂无';}
function homeDiaryPct(){const m=DB.get('moods')||{};const v=m[today()];return v?Math.round(v/5*100):0;}
function homeDiaryDetail(){const m=DB.get('moods')||{};const v=m[today()];const emo=['😔','😐','🙂','😊','🤩'];return v?emo[v-1]:'未记录';}
function homeCreatePct(){const f=DB.get('fans')||{current:0,target:10000};return Math.round((f.current||0)/(f.target||10000)*100);}
function homeCreateDetail(){const s=DB.get('schedule')||[];return '排期'+s.length+'条';}
function editYesterday(){
  openModal('记录昨日花费',`<div class="field"><label>金额</label><input id="f_amt" type="number" value="${DB.get('settings')?.yesterdaySpend||0}"></div>`,()=>{const s=DB.get('settings')||{};s.yesterdaySpend=+$('f_amt').value||0;DB.set('settings',s);switchView('home');toast('已记录');});
}

function renderLedger(){
  const tab=state.tabs.ledger||'record';
  const tabs=[{k:'record',l:'收支记录'},{k:'invest',l:'资产盘点'}];
  const tabBar=`<div class="tabs">${tabs.map(t=>`<div class="tab ${tab===t.k?'active':''}" onclick="state.tabs.ledger='${t.k}';renderLedger()">${t.l}</div>`).join('')}</div>`;
  if(tab==='invest'){
    const inv=DB.get('invest')||{娜指:0,红利:0,黄金:0,债券:0};
    const items=['娜指','红利','黄金','债券'];
    const total=items.reduce((a,k)=>a+(+inv[k]||0),0);
    const body=items.map(k=>`<div class="hbar"><div class="hbar-top"><span>${k}</span><span>¥${(+inv[k]||0).toLocaleString()}</span></div><div class="hbar-track"><div class="hbar-fill" style="width:${total?Math.round((+inv[k]||0)/total*100):0}%"></div></div></div>`).join('');
    const heat=DB.get('investHeat')||{娜指:50,红利:50,黄金:50,债券:50};
    const hotspot=items.map(k=>{const h=+heat[k]||0;const zone=h>=66?'高位':h>=33?'中位':'低位';const color=h>=66?'var(--bad)':h>=33?'var(--warn)':'var(--good)';return `<div class="hbar"><div class="hbar-top"><span>${k}</span><span style="color:${color};font-weight:700">${zone} · ${h}</span></div><div style="position:relative;height:14px;background:linear-gradient(90deg,var(--good) 0%,var(--good) 33%,var(--warn) 33%,var(--warn) 66%,var(--bad) 66%,var(--bad) 100%);border-radius:999px;margin-top:4px"><div style="position:absolute;top:-3px;left:calc(${h}% - 7px);width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid ${color}"></div></div></div>`;}).join('');
    $('content').innerHTML=`${tabBar}
      <div class="card">
        <div class="card-head"><div class="card-title">💡 资产盘点</div><button class="btn ghost small" onclick="editInvest()">编辑资产</button></div>
        <div style="font-size:13px;color:var(--soft);margin-bottom:10px">记录目前在各方向的投入，看清仓位分布。</div>
        ${body}
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><span style="color:var(--soft)">总投入</span><span style="font-size:22px;font-weight:700">¥${total.toLocaleString()}</span></div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title">📈 投资热点图</div><button class="btn ghost small" onclick="editInvestHeat()">编辑热度</button></div>
        <div style="font-size:12px;color:var(--soft);margin-bottom:10px">绿=低位，黄=中位，红=高位。看各方向当前是否在高点。</div>
        ${hotspot}
      </div>`;
    return;
  }
  const txs=DB.get('ledger')||[];
  const month=txs.filter(t=>t.date.startsWith(ym()));
  const inc=month.filter(t=>t.type==='income').reduce((a,b)=>a+b.amount,0);
  const exp=month.filter(t=>t.type==='expense').reduce((a,b)=>a+b.amount,0);
  const cats=['饮食','购物','玩乐'];
  const catSum=c=>month.filter(t=>t.type==='expense'&&t.category===c).reduce((a,b)=>a+b.amount,0);
  const max=Math.max(...cats.map(catSum),1);
  $('content').innerHTML=`
    ${tabBar}
    <div class="ledger-summary">
      <div class="ledger-card"><div class="label">本月收入</div><div class="num" style="color:var(--good)">¥${inc}</div></div>
      <div class="ledger-card"><div class="label">本月支出</div><div class="num" style="color:var(--bad)">¥${exp}</div></div>
      <div class="ledger-card"><div class="label">结余</div><div class="num">¥${inc-exp}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">📊 分类开销</div></div>
      ${cats.map(c=>{const s=catSum(c);return `<div class="hbar"><div class="hbar-top"><span>${c}</span><span>¥${s}</span></div><div class="hbar-track"><div class="hbar-fill" style="width:${Math.round(s/max*100)}%"></div></div></div>`}).join('')}
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title">🧾 全部记录（${txs.length} 条）</div><button class="btn small" onclick="addLedger()">+ 记一笔</button></div>
      ${txs.slice().reverse().map(t=>`<div class="list-item"><div class="list-body"><div class="list-title">${esc(t.category)}${t.note?' · '+esc(t.note):''}</div><div class="list-meta">📅 ${t.date} <span class="chip">${t.type==='income'?'收入':'支出'}</span></div></div><div style="font-weight:700;color:${t.type==='income'?'var(--good)':'var(--bad)'}">${t.type==='income'?'+':'-'}¥${t.amount}</div><button class="btn ghost small" style="margin-left:8px" onclick="DB.del('ledger','${t.id}');switchView('ledger')">×</button></div>`).join('')||'<div class="empty">暂无记录</div>'}
    </div>
  `;
}

  }else if(tab==='food'){
    const fh=DB.get('foodHot')||[];
    const foodRow=f=>`<div class="media-card" style="cursor:pointer" onclick="openFoodHot('${f.id}')"><div class="media-cover">${f.cat==='菜'?'🍳':'☕'}</div><div class="media-info"><div class="media-title">${esc(f.title)} <span class="chip">${f.platform}</span></div><div style="color:var(--soft);font-size:13px;margin-top:4px">${esc(f.desc||'')}</div></div><span style="color:var(--accent);font-size:14px">进入 ›</span></div>`;
    body=`<div class="section-title">🍳 全网快手菜</div>`+(fh.filter(f=>f.cat==='菜').map(foodRow).join('')||'<div class="empty">暂无快手菜</div>');
    body+=`<div class="section-title">☕ 饮料 · 咖啡制作</div>`+(fh.filter(f=>f.cat==='饮').map(foodRow).join('')||'<div class="empty">暂无饮料配方</div>');
  }else{
    body=`<div class="quote-card"><div class="quote-label">📖 今日必读</div><div class="quote-en">${esc(en.sentence||'')}</div><div class="quote-cn">${esc(en.translation||'')}</div></div>`;
    body+=`<div class="card" style="margin-top:12px"><div class="card-head"><div class="card-title">📝 每日一词</div></div><div style="font-size:26px;font-weight:700">${esc(en.word||'bloom')} <span style="font-size:15px;color:var(--soft);font-weight:400">${esc(en.phonetic||'')}</span></div><div style="margin:8px 0;color:var(--soft)">${esc(en.meaning||'')}</div><div style="padding:10px;background:var(--elev);border-radius:var(--radius-sm);font-size:14px;color:var(--ink)">${esc(en.example||'')}</div></div><div class="section-title">今日 4 词 · 每天复习一遍</div>`+(en.words||[]).map(w=>`<div class="media-card"><div class="media-info"><div class="media-title">${esc(w.en)}</div><div style="color:var(--soft);font-size:13px">${esc(w.cn)}</div><div style="margin-top:6px;font-size:13px;color:var(--soft)">${esc(w.ex)}</div></div></div>`).join('');
  }
  $('content').innerHTML=`
    <div class="tabs">${tabs.map(t=>`<div class="tab ${tab===t.k?'active':''}" onclick="state.tabs.media='${t.k}';renderMedia()">${t.l}</div>`).join('')}</div>

  `;
}
function addDrum(){openModal('添加非洲鼓教学内容',`<div class="field"><label>标题</label><input id="f_title" placeholder="如：基础低音 Bass 打法"></div><div class="field"><label>要点</label><textarea id="f_note" rows="3" placeholder="打法说明、练习要点"></textarea></div><div class="field"><label>掌握进度 %</label><input id="f_progress" type="number" value="0"></div>`,()=>{DB.push('drum',{id:uid(),title:$('f_title').value,note:$('f_note').value,progress:+$('f_progress').value||0});switchView('media');toast('已添加');});}
function openDrumHot(id){const h=(DB.get('drumHot')||[]).find(x=>x.id===id);if(!h)return;const url='https://www.baidu.com/s?wd='+encodeURIComponent(h.kw||h.title);openModal(h.platform+' · 热门内容',`<div style="font-size:16px;font-weight:600;margin-bottom:8px">${esc(h.title)}</div><div style="color:var(--soft);font-size:14px;line-height:1.6">${esc(h.desc||'')}</div><div style="margin-top:12px"><button class="btn small" onclick="window.open('${url}','_blank')">前往${esc(h.platform)}查看 ›</button></div>`);}
function addFood(){openModal('添加美食/饮品',`<div class="field"><label>类型</label><select id="f_cat"><option value="菜">快手菜</option><option value="饮">饮料/咖啡</option></select></div><div class="field"><label>标题</label><input id="f_title" placeholder="如：10 分钟快手番茄炒蛋"></div><div class="field"><label>平台</label><select id="f_plat"><option>小红书</option><option>抖音</option><option>B站</option><option>公众号</option><option>其他</option></select></div><div class="field"><label>做法简介</label><textarea id="f_desc" rows="2" placeholder="关键步骤或亮点"></textarea></div><div class="field"><label>搜索关键词</label><input id="f_kw" placeholder="用于一键搜索查看"></div>`,()=>{DB.push('foodHot',{id:uid(),cat:$('f_cat').value,platform:$('f_plat').value,title:$('f_title').value,desc:$('f_desc').value.trim(),kw:$('f_kw').value.trim()||$('f_title').value});switchView('media');toast('已添加');});}
function openFoodHot(id){const h=(DB.get('foodHot')||[]).find(x=>x.id===id);if(!h)return;const url='https://www.baidu.com/s?wd='+encodeURIComponent(h.kw||h.title);openModal(h.platform+' · '+(h.cat==='菜'?'快手菜':'饮料咖啡'),`<div style="font-size:16px;font-weight:600;margin-bottom:8px">${esc(h.title)}</div><div style="color:var(--soft);font-size:14px;line-height:1.6">${esc(h.desc||'')}</div><div style="margin-top:12px"><button class="btn small" onclick="window.open('${url}','_blank')">前往${esc(h.platform)}查看 ›</button></div>`);}
function mediaCard(m){return `<div class="media-card"><div class="media-cover">${m.kind==='book'?'📖':'🎬'}</div><div class="media-info"><div class="media-title">${esc(m.title)} <span class="chip">${m.kind==='book'?'书':'影'}</span></div><div class="media-meta">${esc(m.author||'')} · ${m.status} · 评分 ${'★'.repeat(m.rating||0)}${'☆'.repeat(5-(m.rating||0))}</div><div class="hbar-track" style="margin-top:8px"><div class="hbar-fill" style="width:${m.progress||0}%"></div></div></div><button class="btn ghost small" onclick="editMedia('${m.id}')">编辑</button></div>`;}
function addMedia(){openModal('添加书/影',`<div class="field"><label>名称</label><input id="f_title"></div><div class="field"><label>作者/导演</label><input id="f_author"></div><div class="field"><label>类型</label><select id="f_kind"><option value="book">书</option><option value="movie">影</option></select></div><div class="field"><label>进度 %</label><input id="f_progress" type="number" value="0"></div><div class="field"><label>评分 1-5</label><input id="f_rating" type="number" min="1" max="5" value="5"></div><div class="field"><label>状态</label><select id="f_status"><option>在读</option><option>已看</option><option>想看</option></select></div><div class="field"><label>书评 / 影评</label><textarea id="f_review" rows="2" placeholder="看完写两句（可选）"></textarea></div>`,()=>{DB.push('media',{id:uid(),kind:$('f_kind').value,title:$('f_title').value,author:$('f_author').value,progress:+$('f_progress').value||0,rating:+$('f_rating').value||0,status:$('f_status').value,review:$('f_review').value.trim()});switchView('media');toast('已添加');});}
function editMedia(id){const m=(DB.get('media')||[]).find(x=>x.id===id);openModal('编辑书/影',`<div class="field"><label>进度 %</label><input id="f_progress" type="number" value="${m.progress}"></div><div class="field"><label>评分 1-5</label><input id="f_rating" type="number" value="${m.rating}"></div><div class="field"><label>状态</label><select id="f_status"><option ${m.status==='在读'?'selected':''}>在读</option><option ${m.status==='已看'?'selected':''}>已看</option><option ${m.status==='想看'?'selected':''}>想看</option></select></div><div class="field"><label>书评 / 影评</label><textarea id="f_review" rows="2" placeholder="看完写两句（可选）">${esc(m.review||'')}</textarea></div>`,()=>{const a=DB.get('media');const x=a.find(z=>z.id===id);x.progress=+$('f_progress').value;x.rating=+$('f_rating').value;x.status=$('f_status').value;x.review=$('f_review').value.trim();DB.set('media',a);switchView('media');toast('已保存');});}

// ========== DIARY ==========
function renderDiary(){
  const d=(DB.get('diary')||{})[today()]||{body:'',mood:'',tags:''};
  const moods=DB.get('moods')||{};
  const mood=moods[today()]||0;
  const sparks=DB.get('sparks')||[];
  const success=(DB.get('success')||[]).map(s=>`<div class="todo-item"><div class="todo-check done"></div><div class="todo-text">${esc(s.item)}</div></div>`).join('')||'<div class="empty">还没有成功日记</div>';
  const review=(DB.get('review')||[]).map(r=>`<div class="todo-item"><div class="todo-check"></div><div class="todo-text">${esc(r.item)}</div></div>`).join('')||'<div class="empty">还没有复盘</div>';
  $('content').innerHTML=`
    <div class="card">
      <div class="card-head"><div class="card-title">🌙 日记反思 · ${fmtDate(today())}</div></div>
      <div class="field"><label>今日心情</label><div class="diary-moods">${[1,2,3,4,5].map(i=>`<div class="mood-btn ${mood===i?'active':''}" onclick="setMood(${i})">${['😔','😐','🙂','😊','🤩'][i-1]}</div>`).join('')}</div></div>
      <div class="field"><label>日记正文</label><textarea id="dy_body" rows="5" placeholder="今天发生了什么…" onchange="saveDiaryBody()">${esc(d.body||'')}</textarea></div>
      <div class="field"><label>💡 闪念</label>${sparks.slice(0,3).map(s=>`<div class="chip" style="margin:3px 3px 0 0">${esc(s.content.slice(0,20))}</div>`).join('')||'<span style="color:var(--muted);font-size:13px">暂无闪念</span>'}<button class="btn small" style="margin-top:8px" onclick="addSpark()">+ 记闪念</button></div>
    </div>
    <div class="section-title">🌟 成功日记</div>
    <div class="card"><div class="card-head"><div class="card-title">🌟 成功日记</div><button class="btn small" onclick="addDiaryItem('success')">+ 添加</button></div>${success}</div>
    <div class="section-title">🧠 思考复盘</div>
    <div class="card"><div class="card-head"><div class="card-title">🧠 思考复盘</div><button class="btn small" onclick="addDiaryItem('review')">+ 添加</button></div>${review}</div>
  `;
}
function saveDiaryBody(){const di=DB.get('diary')||{};if(!di[today()])di[today()]={body:'',mood:'',tags:''};di[today()].body=$('dy_body').value;DB.set('diary',di);toast('日记已自动保存')}
function setMood(n){const m=DB.get('moods')||{};m[today()]=n;DB.set('moods',m);renderDiary();toast('心情已记录')}
function addSpark(){openModal('记闪念',`<div class="field"><label>闪念</label><textarea id="f_content" rows="3" placeholder="突然想到…"></textarea></div>`,()=>{DB.push('sparks',{id:uid(),content:$('f_content').value,date:today()});renderDiary();toast('已记录');});}
function addDiaryItem(type){openModal(type==='success'?'添加成功日记':'添加复盘',`<div class="field"><label>内容</label><textarea id="f_item" rows="3"></textarea></div>`,()=>{DB.push(type==='success'?'success':'review',{id:uid(),date:today(),item:$('f_item').value});renderDiary();toast('已添加');});}

// ========== HEALTH ==========
function renderHealth(){
  const tab=state.tabs.health||'record';
  const tabs=[{k:'record',l:'记录'},{k:'fortune',l:'每日运势'},{k:'answer',l:'答案之书'},{k:'happy',l:'幸福记录'}];

    const birth=DB.get('birth')||{};
    const hours=['子时 23-1','丑时 1-3','寅时 3-5','卯时 5-7','辰时 7-9','巳时 9-11','午时 11-13','未时 13-15','申时 15-17','酉时 17-19','戌时 19-21','亥时 21-23'];

      <div style="display:flex;gap:10px;flex-wrap:wrap">

      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <div class="field" style="flex:1;min-width:140px;margin:0"><label>性别</label><select id="f_bgender"><option ${birth.gender==='女'?'selected':''}>女</option><option ${birth.gender==='男'?'selected':''}>男</option></select></div>
        <div class="field" style="flex:1;min-width:140px;margin:0"><label>出生地（选填）</label><input id="f_bplace" value="${birth.place||''}"></div>
      </div>
      <div style="font-size:12px;color:var(--soft);margin-top:6px">保存后自动调取生辰八字 · 八卦 · 紫薇 · 星座 · 塔罗牌（公历近似，仅供参考）。</div>
    </div>`;
    let f=DB.get('fortune')||{date:today()};

    const blocks=[{k:'bagua',t:'☯ 八卦'},{k:'ziwei',t:'🌟 紫薇'},{k:'zodiac',t:'♒ 星座'},{k:'tarot',t:'🃏 塔罗牌'}];
    const body=blocks.map(b=>`<div class="health-card" style="cursor:default"><div class="card-head"><div class="card-title">${b.t}</div></div><textarea style="width:100%;min-height:90px;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--elev);color:var(--ink);font-size:14px;font-family:inherit;resize:vertical;line-height:1.5" onchange="saveFortune('${b.k}',this.value)" placeholder="写下今日${b.t}…">${esc(f[b.k]||'')}</textarea></div>`).join('');

      : `<div class="health-card" style="grid-column:1/-1;text-align:center;padding:30px 18px;cursor:default"><div style="font-size:40px;margin-bottom:8px">📖</div><div style="font-size:14px;color:var(--soft);margin-bottom:14px">静心一想，点击抽取属于你今天的答案</div><button class="btn" onclick="drawAnswer()">🎲 今日抽取</button></div>`;

  }
  if(tab==='happy'){

    const body=list.length?list.map(r=>`<div class="media-card" style="border-left:4px solid ${CATCOLOR[r.cat]||'#ccc'}"><div class="media-info"><div class="media-title">${esc(r.title)} <span class="chip" style="background:${CATCOLOR[r.cat]||'#999'};color:#fff;border:none">${r.cat}</span></div><div style="color:var(--soft);font-size:12px;margin:2px 0">${r.date||''}</div><div style="font-size:14px;color:var(--ink);line-height:1.5;margin-top:4px">${esc(r.note||'')}</div>${r.imgs&&r.imgs.length?`<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">${r.imgs.map(im=>`<img src="${im}" style="width:64px;height:64px;object-fit:cover;border-radius:8px">`).join('')}</div>`:''}</div><button class="btn ghost small" onclick="DB.del('life','${r.id}');renderHealth()">删除</button></div>`).join(''):'<div class="empty">还没有记录，点「+ 添加」写一条吧</div>';

    return;
  }
  const h=DB.get('health')||{exercise:[],sleep:[],water:[],monthGoal:20};
  const todayEx=(h.exercise||[]).find(x=>x.date===today());
  const todaySleep=(h.sleep||[]).find(x=>x.date===today());
  const todayWater=(h.water||[]).find(x=>x.date===today());
  const diet=(h.diet&&h.diet.date===today())?h.diet:{date:today(),breakfast:0,lunch:0,dinner:0};
  const dietTotal=diet.breakfast+diet.lunch+diet.dinner;
  const ym=today().slice(0,7);
  const exCount=(h.exercise||[]).filter(x=>x.date&&x.date.indexOf(ym)===0).length;
  const goal=h.monthGoal||20;
  const goalPct=Math.min(100,Math.round(exCount/goal*100));
  $('content').innerHTML=`
    ${tabBar}
    <div class="health-grid">
      <div class="health-card" style="grid-column:1/-1">
        <div class="card-head"><div class="card-title">🎯 本月目标</div><button class="btn ghost small" onclick="editMonthGoal()">设置</button></div>

          <div style="font-size:26px;font-weight:700">${exCount}</div>
          <div style="color:var(--soft);font-size:14px">/ ${goal} 次 运动</div>
        </div>
        <div class="hbar-track" style="margin:10px 0"><div class="hbar-fill" style="width:${goalPct}%;background:linear-gradient(90deg,var(--accent),var(--accent-4))"></div></div>
        <div style="font-size:12px;color:var(--soft)">本月已运动 ${exCount} 次，还差 ${Math.max(0,goal-exCount)} 次达标</div>
      </div>
      <div class="health-card">
        <div class="card-head"><div class="card-title">🍱 饮食记录</div></div>
        <div style="font-size:24px;font-weight:700">${dietTotal} <span style="font-size:14px;font-weight:400;color:var(--soft)">千卡</span></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px">
          <div class="field" style="margin:0"><label style="font-size:11px">早餐</label><input id="diet_b" type="number" value="${diet.breakfast}" onchange="saveDiet('breakfast',this.value)"></div>
          <div class="field" style="margin:0"><label style="font-size:11px">午餐</label><input id="diet_l" type="number" value="${diet.lunch}" onchange="saveDiet('lunch',this.value)"></div>
          <div class="field" style="margin:0"><label style="font-size:11px">晚餐</label><input id="diet_d" type="number" value="${diet.dinner}" onchange="saveDiet('dinner',this.value)"></div>
        </div>
      </div>
      <div class="health-card">
        <div class="card-head"><div class="card-title">🏃 运动记录</div></div>
        ${todayEx?`<div style="font-size:24px;font-weight:700">${todayEx.duration} <span style="font-size:14px;font-weight:400;color:var(--soft)">分钟</span></div><div style="color:var(--soft);font-size:13px">${todayEx.type} · ${todayEx.distance||0} km</div>`:'<div class="empty" style="padding:10px">今天还没运动</div>'}
        <button class="btn small" style="margin-top:10px" onclick="addExercise()">+ 记录运动</button>
      </div>
      <div class="health-card">
        <div class="card-head"><div class="card-title">😴 睡眠记录</div></div>
        ${todaySleep?`<div style="font-size:24px;font-weight:700">${todaySleep.hours} <span style="font-size:14px;font-weight:400;color:var(--soft)">小时</span></div><div style="color:var(--soft);font-size:13px">昨晚睡眠质量</div>`:'<div class="empty" style="padding:10px">昨晚睡眠未记录</div>'}
        <button class="btn small" style="margin-top:10px" onclick="addSleep()">+ 记录睡眠</button>
      </div>
      <div class="health-card">
        <div class="card-head"><div class="card-title">💧 喝水记录</div></div>
        <div style="display:flex;align-items:center;gap:10px">
          <div style="font-size:32px;font-weight:700">${todayWater?todayWater.cups:0}</div>
          <div style="color:var(--soft);font-size:13px">杯 / 目标 8 杯</div>
        </div>
        <div class="hbar-track" style="margin:10px 0"><div class="hbar-fill" style="width:${Math.min(100,((todayWater?todayWater.cups:0)/8)*100)}%;background:linear-gradient(90deg,var(--accent-3),var(--accent))"></div></div>
        <div style="display:flex;gap:8px"><button class="btn small" onclick="addWater(1)">+1 杯</button><button class="btn ghost small" onclick="addWater(-1)">-1 杯</button></div>
      </div>
    </div>
  `;
}
function saveBasic(){const b={date:$('f_bdate').value,hour:+$('f_bhour').value,gender:$('f_bgender').value,place:$('f_bplace').value};DB.set('birth',b);const c=computeFortune(b);if(c)DB.set('fortune',{date:today(),bagua:c.bagua,ziwei:c.ziwei,zodiac:c.zodiac,tarot:c.tarot});state.tabs.health='fortune';switchView('health');toast('已生成运势');}
function drawAnswer(){const book=DB.get('answerBook')||[];if(!book.length){toast('答案库为空');return;}const text=book[Math.floor(Math.random()*book.length)];DB.set('answerToday',{date:today(),text});renderHealth();toast('今日答案已揭晓');}
function addHappy(){openModal('添加幸福记录',`<div class="field"><label>分类</label><select id="f_cat"><option>家庭</option><option>朋友</option><option>体验</option><option>娱乐</option></select></div><div class="field"><label>标题</label><input id="f_title" placeholder="如：和爸妈视频通话"></div><div class="field"><label>记录</label><textarea id="f_note" rows="3" placeholder="写下细节、感受或案例"></textarea></div><div class="field"><label>图片（最多 9 张）</label><input id="f_img" type="file" accept="image/*" multiple></div>`,()=>{const files=$('f_img').files;const doSave=imgs=>{DB.push('life',{id:uid(),cat:$('f_cat').value,title:$('f_title').value,note:$('f_note').value,date:today(),imgs:imgs});switchView('health');toast('已添加');};if(files&&files.length){compressImages(files,doSave);}else{doSave([]);}});}
function editMonthGoal(){const h=DB.get('health')||{};openModal('设置本月目标',`<div class="field"><label>本月运动目标（次）</label><input id="f_goal" type="number" value="${h.monthGoal||20}"></div>`,()=>{const hh=DB.get('health')||{exercise:[],sleep:[],water:[]};hh.monthGoal=+$('f_goal').value||20;DB.set('health',hh);switchView('health');toast('已保存');});}
function saveFortune(key,val){const f=DB.get('fortune')||{date:today()};f.date=today();f[key]=val;DB.set('fortune',f);toast('已保存');}
function saveDiet(meal,val){const h=DB.get('health')||{exercise:[],sleep:[],water:[]};let d=(h.diet&&h.diet.date===today())?h.diet:{date:today(),breakfast:0,lunch:0,dinner:0};d[meal]=+val||0;h.diet=d;DB.set('health',h);switchView('health');}
function addExercise(){openModal('记录运动',`<div class="field"><label>运动类型</label><input id="f_type" placeholder="跑步 / 瑜伽 / 力量"></div><div class="field"><label>时长（分钟）</label><input id="f_duration" type="number" value="30"></div><div class="field"><label>距离（km，可选）</label><input id="f_distance" type="number" value="0"></div>`,()=>{const h=DB.get('health')||{exercise:[],sleep:[],water:[]};h.exercise=h.exercise.filter(x=>x.date!==today());h.exercise.push({date:today(),type:$('f_type').value||'运动',duration:+$('f_duration').value||0,distance:+$('f_distance').value||0});DB.set('health',h);switchView('health');toast('已记录');});}
function addSleep(){openModal('记录睡眠',`<div class="field"><label>昨晚睡了多久（小时）</label><input id="f_hours" type="number" step="0.1" value="7"></div>`,()=>{const h=DB.get('health')||{exercise:[],sleep:[],water:[]};h.sleep=h.sleep.filter(x=>x.date!==today());h.sleep.push({date:today(),hours:+$('f_hours').value||0});DB.set('health',h);switchView('health');toast('已记录');});}
function addWater(delta){const h=DB.get('health')||{exercise:[],sleep:[],water:[]};let w=(h.water||[]).find(x=>x.date===today());if(!w){w={date:today(),cups:0};h.water.push(w);}w.cups=Math.max(0,w.cups+delta);DB.set('health',h);switchView('health');}

// ========== DATA ==========
function exportData(){
  const payload={};['todos','goals','trips','fans','schedule','aiaccounts','ainews','gold','finnews','ledger','media','english','diary','sparks','success','review','health','moods','settings','quotes','life','fortune','drum','invest','investHeat','drumHot','drumToday','foodHot','answerBook','answerToday','birth'].forEach(k=>{payload[k]=DB.get(k)});
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='qiuqiu-workbench-'+today()+'.json';a.click();toast('已导出备份');
}
function importData(){
  const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);Object.keys(d).forEach(k=>DB.set(k,d[k]));switchView('home');toast('导入成功');}catch(err){toast('导入失败：文件格式不对');}};r.readAsText(f);};input.click();
}
function clearSamples(){if(!confirm('确定清空示例数据？自己的记录也会清空。'))return;['todos','goals','trips','fans','schedule','aiaccounts','ainews','gold','finnews','ledger','media','english','diary','sparks','success','review','health','moods','settings','quotes','life','fortune','drum','invest','investHeat','drumHot','drumToday','foodHot','answerBook','answerToday','birth'].forEach(k=>localStorage.removeItem(PREFIX+k));seed();switchView('home');toast('已重置');}

init();
</script>
